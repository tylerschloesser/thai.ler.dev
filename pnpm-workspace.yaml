packages:
  - apps/*
  - infra/*
  - packages/*

catalogMode: prefer

catalog:
  # web
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.1.0
  vite: ^8.2.2
  '@base-ui/react': ^1.7.0
  '@radix-ui/colors': ^3.0.0
  # routing + reactive data layer
  '@tanstack/react-router': ^1.170.32
  '@tanstack/router-plugin': ^1.168.35
  '@tanstack/react-query': ^5.102.8
  '@tanstack/react-query-persist-client': ^5.102.8
  '@tanstack/query-async-storage-persister': ^5.102.8
  '@tanstack/db': ^0.8.7
  '@tanstack/react-db': ^0.3.7
  '@tanstack/query-db-collection': ^1.2.12
  '@tanstack/offline-transactions': ^1.0.53
  idb-keyval: ^6.3.0
  vite-plugin-pwa: ^1.3.0
  workbox-window: ^7.4.1
  workbox-build: ^7.4.1
  # styling: typed CSS modules + stylelint
  '@css-modules-kit/codegen': ^1.4.0
  '@css-modules-kit/ts-plugin': ^1.4.0
  '@css-modules-kit/stylelint-plugin': ^1.4.0
  stylelint: ^17.14.1
  stylelint-config-standard: ^40.0.0
  stylelint-config-css-modules: ^4.6.0
  stylelint-config-recess-order: ^7.8.0
  '@double-great/stylelint-a11y': ^3.5.2
  stylelint-value-no-unknown-custom-properties: ^6.1.1
  # api
  '@hono/node-server': ^2.1.1
  hono: ^4.13.7
  '@anthropic-ai/sdk': ^0.124.0
  '@aws-sdk/client-dynamodb': ^3.1127.0
  '@aws-sdk/lib-dynamodb': ^3.1127.0
  '@aws-sdk/client-lambda': ^3.1127.0
  '@aws-sdk/client-secrets-manager': ^3.1127.0
  '@types/aws-lambda': ^8.10.163
  # infra
  aws-cdk-lib: ^2.268.0
  aws-cdk: ^2.1140.0
  constructs: ^10.8.1
  tsx: ^4.20.3
  esbuild: ^0.28.2
  # shared
  typescript: ~6.0.2
  oxlint: ^1.81.0
  '@types/node': ^24.13.3
  zod: ^4.5.4

minimumReleaseAgeExclude:
  - aws-cdk@2.1140.0
  - '@anthropic-ai/sdk@0.124.0'
  - '@aws-sdk/client-dynamodb@3.1127.0'
  - '@aws-sdk/client-lambda@3.1127.0'
  - '@aws-sdk/client-secrets-manager@3.1127.0'
  - '@aws-sdk/lib-dynamodb@3.1127.0'
  - hono@4.13.7

allowBuilds:
  # transitive dep of the aws-cdk CLI; its postinstall links the platform binary
  esbuild: true
