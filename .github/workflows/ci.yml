# Runs on every pull request: the same lint/typecheck/build as deploy.yml,
# then the Playwright e2e suite against the local backend.
#
# `pnpm build` must come before `pnpm test:e2e`. Under CI the Playwright
# config does not build the web app — it expects `apps/web/dist` to exist
# and only starts `vite preview`.
#
# Keep the toolchain steps in sync with deploy.yml and claude.yml.

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      # Keyed on the lockfile because the browser build is pinned by the
      # @playwright/test version the lockfile resolves.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      - run: pnpm test:e2e
        env:
          CI: '1'

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
